name: Publicare Pages și monitorizare

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      VITE_BASE_PATH: /starea-statului/
      PUBLIC_SITE_URL: https://capitanumihai.github.io/starea-statului/
      VITE_DATA_SOURCE: pages
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.x'
      - name: Instalează dependențele
        run: npm --prefix apps/web ci
      - name: Verifică sursele
        run: npm test
      - name: Restaurează istoricul public
        run: node scripts/pages-monitor.mjs restore
      - name: Colectează o rundă de probe
        run: node scripts/pages-monitor.mjs collect
      - name: Construiește site-ul
        run: npm run build
      - name: Verifică pachetul public
        run: |
          npm run test:sites
          npm run test:pages-build
      - name: Păstrează istoricul public
        run: node scripts/pages-monitor.mjs publish
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: apps/web/dist/client
      - name: Publică site-ul
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
